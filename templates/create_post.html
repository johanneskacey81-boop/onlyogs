<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .form-container { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 5px; }
        h1 { color: #333; }
        textarea { width: 100%; height: 120px; padding: 10px; font-family: Arial; border: 1px solid #ddd; border-radius: 3px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: 600; margin-top: 10px; margin-right: 10px; }
        button:hover { background: #0056b3; }
        a { text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Create Post</h1>
        <form method="POST">
            <textarea name="body" placeholder="What's on your mind?" required></textarea>
            <br>
            <button type="submit">📝 Post</button>
            <a href="{{ url_for('feed') }}"><button type="button">← Back to Feed</button></a>
        </form>
    </div>
</body>
</html>
